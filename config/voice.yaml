# =============================================================================
# voice.yaml — local-ai-companion-v2 运行时配置
# =============================================================================
# 所有可调参数，带注释说明含义。
# 修改后重启 start-voice.sh 生效。
# =============================================================================

# ---------------------------------------------------------------------------
# VAD (Voice Activity Detection) 静音检测
# ---------------------------------------------------------------------------
VAD_THRESH: 0.5
# 静音能量阈值，范围 0-1。
# 值越低越灵敏（更容易判定为"有声音"），值越高越迟钝。
# 安静环境建议 0.3-0.5，嘈杂环境建议 0.6-0.8。

MIN_SILENCE_MS: 700
# 判定"用户说完一句话"的最小连续静音时长（毫秒）。
# 较短（如 400ms）会让系统更快响应但可能中途截断；
# 较长（如 1000ms）会等待更久才判定句尾。
# 中文自然停顿建议 600-800ms。

MAX_AUDIO_SEC: 20
# 单次录音的最大时长（秒）。超过此值自动截断并送入 ASR。
# 防止用户忘记停止录音导致无限采集。

# ---------------------------------------------------------------------------
# ASR (Automatic Speech Recognition) 语音识别
# ---------------------------------------------------------------------------
ASR_MODEL: "/root/setup/models/faster-whisper-large-v3"
# 直接使用已下载的本地模型目录；离线模式下不能只写 large-v3 别名。

ASR_LANG: "zh"
# 转写目标语言。中文使用 "zh"。
# 也支持 "en" 等 faster-whisper 支持的语言代码。

# ---------------------------------------------------------------------------
# LLM (Large Language Model) 大模型
# ---------------------------------------------------------------------------
LLM_BASE_URL: "http://172.18.160.1:11434"
# llama.cpp llama-server 的地址（WSL2 内通过 localhostForwarding 访问 Windows 侧服务）。
# 若 localhostForwarding 不可用，改为 Windows 主机 IP（见 /etc/resolv.conf 中的 nameserver），
# 如 "http://172.30.96.1:8090"。

LLM_MODEL: "qwen2.5:7b-instruct"
# 大模型名称，用于 POST /v1/chat/completions 的 model 字段。
# 16GB 卡默认: "qwen3-8b"
# 24GB 卡推荐: "qwen3-14b"

LLM_MAX_TOKENS: 1024
# 单次 LLM 回复的最大 token 数。

LLM_TEMPERATURE: 0.7
# LLM 生成温度。0=确定性，1=随机性高。
LLM_KEEP_ALIVE: "24h"
# Ollama 预热请求的模型驻留时间，避免空闲后首轮冷启动。
LLM_WARMUP_ENABLED: true
# 启动时顺序预热 TTS 克隆音色和 Ollama，首轮不再承担模型加载成本。

# ---------------------------------------------------------------------------
# TTS (Text-to-Speech) 语音合成
# ---------------------------------------------------------------------------
VOXCPM_MODEL_ID: "VoxCPM2"
VOXCPM_PROFILE: "balanced-v2"
VOXCPM_MODEL_PATH: "/mnt/d/codexWorkSpec/chatAI-comPes/models/VoxCPM2"
VOXCPM_REF_WAV: "~/setup/ref-fast.wav"
VOXCPM_REF_TEXT: "大家好，我是主播，很多人在看我的视频之后呢，都说我讲话好温柔。"
VOXCPM_SAMPLE_RATE: 48000
VOXCPM_WORKER_URL: "http://127.0.0.1:8020"
VOXCPM_LOCAL_FILES_ONLY: true
VOXCPM_STYLE_PROMPT: "语速自然"
# VoxCPM2 原生括号指令，只影响合成语音，不改变聊天界面文本。
# 预热音频只用于后台热身，不在正式回答前播放，避免等待阶段出现杂音。
# CosyVoice3 首块 token 数；更小首块更快，后续块自动放大保持音质。
# VoxCPM2 uses a 48kHz stream; switch the profile and sample rate together
# when falling back to VoxCPM1.5 (safe-v15, 44.1kHz).
# edge = 极速神经网络女声；qwen = 本地克隆音色但延迟较高。
# Qwen3-TTS 1.7B 模型权重目录。

# 音色克隆参考音频路径。
# 用户上传音频会覆盖此路径（原文件备份到 uploads/）。

# 使用 5 秒对齐片段作为运行时提示，保留克隆音色同时减少首轮提示上下文。

# TTS 输出音频采样率（Hz）。16kHz 兼顾质量与传输效率。

# ---------------------------------------------------------------------------
# LiveTalking 数字人口型驱动
# ---------------------------------------------------------------------------
LIVETALKING_URL: "http://localhost:8010"
AVATAR_OUTPUT_SAMPLE_RATE: 16000
AVATAR_FRAME_MS: 20
AVATAR_PREBUFFER_MS: 1200
AVATAR_REBUFFER_MS: 400
AVATAR_MAX_BUFFER_MS: 6000
AVATAR_AUDIO_GAIN: 1.8
AVATAR_FADE_IN_MS: 80
AVATAR_LEAD_IN_MS: 200
# VoxCPM remains 48 kHz. The app performs one stateful 48 kHz -> 16 kHz
# conversion, buffers 1.2 s, primes WebRTC with 200 ms of silence, then feeds
# LiveTalking on an exact 20 ms clock with a gentle 80 ms speech fade-in.
# This value reflects the measured VoxCPM2 generation jitter on the RTX 5060 Ti.
# Lowering it reduces latency but makes sentence-boundary stalls more likely.
# LiveTalking 服务地址（WSL2 内）。
# 口型驱动与 WebRTC 推送的目标。

AVATAR_SYNC_URL: "http://localhost:8011"
# avatar-sync.js 服务地址（WSL2 内）。
# TTS 音频经此桥接转发到 LiveTalking。

# ---------------------------------------------------------------------------
# 系统参数
# ---------------------------------------------------------------------------
LOG_LEVEL: "INFO"
# 日志级别: DEBUG, INFO, WARNING, ERROR。
# 调试时建议 DEBUG，正常使用建议 INFO。

LOG_DIR: "~/setup/logs"
# 日志文件输出目录。

UPLOAD_DIR: "~/setup/uploads"
# 用户上传的参考音频存放目录。

MAX_UPLOAD_SIZE_MB: 15
# 参考音频上传的最大文件大小（MB）。

MIN_REF_AUDIO_SEC: 5
# 参考音频最短时长（秒）。

MAX_REF_AUDIO_SEC: 15
# 参考音频最长时长（秒）。

ALLOWED_AUDIO_EXTENSIONS: ["wav", "mp3", "m4a", "flac"]
# 允许上传的参考音频扩展名白名单。

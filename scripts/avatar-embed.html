<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080d1a; }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(8,13,26,.34), transparent 30%),
      linear-gradient(0deg, rgba(8,13,26,.20), transparent 28%);
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: none;
    opacity: 0;
    background: transparent;
    transition: opacity 320ms cubic-bezier(.16,1,.3,1);
  }
  #placeholder {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cbd5e1;
    font-family: 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif;
    text-align: center;
    pointer-events: none;
  }
  #placeholder .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a78bfa, #312e81 58%, #0f172a 100%);
    box-shadow: 0 0 40px rgba(124,58,237,.3);
  }
  #placeholder .title { font-size: 16px; }
  #placeholder .sub { margin-top: 5px; color: #7f8aa3; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) {
    video { transition: none; }
  }
</style>
</head>
<body>
<div id="placeholder" role="status" aria-live="polite">
  <div>
    <div class="icon" aria-hidden="true"></div>
    <div class="title">数字人待机中...</div>
    <div class="sub" id="status-text">正在连接...</div>
  </div>
</div>
<video id="video" autoplay playsinline muted aria-label="数字人实时画面"></video>

<script>
var pc = null;
var reconnectTimer = null;
var reconnectDelay = 1000;
var connecting = false;
var videoEl = document.getElementById('video');
var placeholder = document.getElementById('placeholder');
var statusText = document.getElementById('status-text');
var mediaStream = null;
var audioEnabled = false;
var stopped = false;
var SESSION_ID = '0';
var LEASE_KEY = 'psychic-waddle-avatar-lease-v1';
var INSTANCE_ID = (window.crypto && window.crypto.randomUUID)
  ? window.crypto.randomUUID()
  : String(Date.now()) + '-' + String(Math.random()).slice(2);
var hasSessionLease = false;
var leaseTimer = null;

function parseLease(value) {
  try { return value ? JSON.parse(value) : null; } catch (error) { return null; }
}

function claimSessionLease() {
  if (stopped) return false;
  try {
    var current = parseLease(window.localStorage.getItem(LEASE_KEY));
    if (current && current.id !== INSTANCE_ID && current.expiresAt > Date.now()) {
      hasSessionLease = false;
      return false;
    }
    window.localStorage.setItem(LEASE_KEY, JSON.stringify({
      id: INSTANCE_ID,
      expiresAt: Date.now() + 6000
    }));
    var written = parseLease(window.localStorage.getItem(LEASE_KEY));
    hasSessionLease = !!written && written.id === INSTANCE_ID;
  } catch (error) {
    // If storage is disabled, retain the original single-page behavior.
    hasSessionLease = true;
  }
  return hasSessionLease;
}

function refreshSessionLease() {
  if (!hasSessionLease) {
    if (claimSessionLease()) connect();
    return;
  }
  try {
    var current = parseLease(window.localStorage.getItem(LEASE_KEY));
    if (!current || current.id !== INSTANCE_ID) {
      hasSessionLease = false;
      stopConnection(false);
      return;
    }
    current.expiresAt = Date.now() + 6000;
    window.localStorage.setItem(LEASE_KEY, JSON.stringify(current));
  } catch (error) {}
}

function releaseSessionLease() {
  if (!hasSessionLease) return;
  try {
    var current = parseLease(window.localStorage.getItem(LEASE_KEY));
    if (current && current.id === INSTANCE_ID) window.localStorage.removeItem(LEASE_KEY);
  } catch (error) {}
  hasSessionLease = false;
}

function revealVideo() {
  placeholder.style.display = 'none';
  videoEl.style.display = 'block';
  requestAnimationFrame(function() { videoEl.style.opacity = '1'; });
}

function scheduleReconnect(message) {
  if (stopped || !hasSessionLease) return;
  if (message) statusText.textContent = message;
  if (reconnectTimer || connecting) return;
  reconnectTimer = window.setTimeout(function() {
    reconnectTimer = null;
    connect();
  }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 8000);
}

function stopConnection(releaseLease) {
  if (reconnectTimer) {
    window.clearTimeout(reconnectTimer);
    reconnectTimer = null;
  }
  connecting = false;
  var oldPc = pc;
  pc = null;
  if (oldPc) {
    try { oldPc.close(); } catch (error) {}
  }
  if (videoEl.srcObject) {
    try {
      videoEl.srcObject.getTracks().forEach(function(track) { track.stop(); });
    } catch (error) {}
    videoEl.srcObject = null;
  }
  mediaStream = null;
  if (releaseLease) releaseSessionLease();
}

function connect() {
  if (stopped || !hasSessionLease || connecting) return;
  connecting = true;
  if (pc) {
    stopConnection(false);
    connecting = true;
  }
  mediaStream = new MediaStream();
  videoEl.srcObject = mediaStream;
  // Start muted so Chromium can establish the WebRTC media element. The
  // parent page sends enable-audio after the user's first gesture.
  videoEl.muted = !audioEnabled;
  videoEl.volume = 1.0;
  pc = new RTCPeerConnection({ sdpSemantics: 'unified-plan' });
  var currentPc = pc;
  currentPc.addTransceiver('video', { direction: 'recvonly' });
  currentPc.addTransceiver('audio', { direction: 'recvonly' });

  currentPc.addEventListener('track', function(evt) {
    if (pc !== currentPc || !hasSessionLease) return;
    if (evt.streams && evt.streams.length) {
      mediaStream = evt.streams[0];
    } else if (evt.track && !mediaStream.getTracks().some(function(track) {
      return track.id === evt.track.id;
    })) {
      mediaStream.addTrack(evt.track);
    }
    videoEl.srcObject = mediaStream;
    if (evt.track.kind === 'video') {
      // Some Chromium/WebRTC combinations do not emit loadeddata for a
      // remote track while the element is display:none. Reveal on track as
      // well, then keep the media events as a second confirmation.
      revealVideo();
      videoEl.onloadeddata = revealVideo;
      videoEl.onplaying = revealVideo;
      videoEl.play().catch(function() {});
    } else if (evt.track.kind === 'audio') {
      // LiveTalking returns the synchronized mouth-driving audio as a WebRTC
      // track. Keep it on the same media element as the video so the browser
      // does not mute the actual cloned voice after the UI refreshes.
      videoEl.muted = !audioEnabled;
      videoEl.volume = 1.0;
      videoEl.play().catch(function(error) {
        statusText.textContent = '请点击页面开启声音';
        console.warn('Audio autoplay blocked:', error);
      });
    }
  });

  currentPc.addEventListener('iceconnectionstatechange', function() {
    if (pc !== currentPc || !hasSessionLease) return;
    statusText.textContent = 'ICE: ' + currentPc.iceConnectionState;
    if (currentPc.iceConnectionState === 'connected' || currentPc.iceConnectionState === 'completed') {
      statusText.textContent = '已连接';
      reconnectDelay = 1000;
    } else if (currentPc.iceConnectionState === 'failed' || currentPc.iceConnectionState === 'closed') {
      connecting = false;
      scheduleReconnect('连接已断开，正在重连...');
    }
  });
  currentPc.addEventListener('connectionstatechange', function() {
    if (pc !== currentPc || !hasSessionLease) return;
    if (currentPc.connectionState === 'connected') {
      connecting = false;
      reconnectDelay = 1000;
    } else if (currentPc.connectionState === 'failed' || currentPc.connectionState === 'closed') {
      connecting = false;
      scheduleReconnect('视频连接已断开，正在重连...');
    }
  });

  currentPc.createOffer()
    .then(function(offer) {
      if (pc !== currentPc || !hasSessionLease) throw new Error('WebRTC lease lost');
      return currentPc.setLocalDescription(offer);
    })
    .then(function() {
      return new Promise(function(resolve) {
        if (currentPc.iceGatheringState === 'complete') return resolve();
        currentPc.addEventListener('icegatheringstatechange', function check() {
          if (currentPc.iceGatheringState === 'complete') {
            currentPc.removeEventListener('icegatheringstatechange', check);
            resolve();
          }
        });
      });
    })
    .then(function() {
      return fetch('/offer', {
        body: JSON.stringify({
          sdp: currentPc.localDescription.sdp,
          type: currentPc.localDescription.type,
          sessionid: SESSION_ID
        }),
        headers: { 'Content-Type': 'application/json' },
        method: 'POST'
      });
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('LiveTalking offer HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(answer) {
      if (pc !== currentPc || !hasSessionLease) return;
      connecting = false;
      return currentPc.setRemoteDescription(answer);
    })
    .catch(function(error) {
      if (pc !== currentPc || !hasSessionLease) return;
      connecting = false;
      scheduleReconnect('连接失败，正在重试...');
      console.error('WebRTC error:', error);
    });
}

window.addEventListener('message', function(evt) {
  if (evt.data && evt.data.type === 'enable-audio') {
    audioEnabled = true;
    videoEl.muted = false;
    videoEl.volume = 1.0;
    videoEl.play().catch(function(error) {
      console.warn('Audio unlock failed:', error);
    });
  }
});

window.addEventListener('storage', function(evt) {
  if (evt.key !== LEASE_KEY || !evt.newValue) return;
  var next = parseLease(evt.newValue);
  if (next && next.id !== INSTANCE_ID && next.expiresAt > Date.now()) {
    hasSessionLease = false;
    stopConnection(false);
  }
});

window.addEventListener('pagehide', function() {
  stopped = true;
  stopConnection(true);
});

claimSessionLease();
if (hasSessionLease) connect();
leaseTimer = window.setInterval(refreshSessionLease, 2000);

// Some WebRTC stacks report a server-side close asynchronously. Polling the
// state as a backstop keeps an idle page from getting stuck on the last frame.
window.setInterval(function() {
  if (!pc) return;
  var state = pc.connectionState || pc.iceConnectionState;
  if (state === 'disconnected' || state === 'failed' || state === 'closed') {
    connecting = false;
    scheduleReconnect('视频连接已断开，正在重连...');
  }
}, 2000);

// Keep the browser-side session aligned with LiveTalking's session manager.
// WebRTC can look connected locally after the server has already evicted the
// session, so the explicit API probe is the reliable recovery signal.
window.setInterval(function() {
  if (!hasSessionLease || !pc || connecting) return;
  var currentPc = pc;
  fetch('/is_speaking', {
    body: JSON.stringify({ sessionid: SESSION_ID }),
    headers: { 'Content-Type': 'application/json' },
    method: 'POST'
  })
    .then(function(resp) { return resp.json(); })
    .then(function(result) {
      if (pc !== currentPc || !hasSessionLease) return;
      if (result.code !== 0) {
        stopConnection(false);
        scheduleReconnect('视频会话已刷新，正在重连...');
      }
    })
    .catch(function() {
      if (pc !== currentPc || !hasSessionLease) return;
      connecting = false;
      scheduleReconnect('视频服务暂时不可用，正在重连...');
    });
}, 5000);
</script>
</body>
</html>
